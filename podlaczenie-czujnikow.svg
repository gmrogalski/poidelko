<text x="85" y="1265" class="label">Jedno połączenie z Pico na każdą szynę</text>
<text x="85" y="1300" class="body">3V3 OUT (pin 36) → szyna „+” → oba czerwone przewody.  GND (pin 38) → szyna „−” → oba czarne przewody.</text>
<text x="85" y="1334" class="body">Sygnały bezpośrednio do Pico: SDA → GP4 (pin 6), SCL → GP5 (pin 7), TDS → GP26 (pin 31).</text>
<text x="65" y="1404" class="small">Kropka = połączenie. Skrzyżowanie bez kropki = osobne przewody. Korzystaj z jednego ciągłego odcinka każdej szyny.</text>
