<text x="65" y="62" class="h">POIDŁO • WSPÓLNE SZYNY ZASILANIA I MASY</text>
<text x="65" y="101" class="sub">Raspberry Pi Pico 2 W / WH · szyna „+” = 3,3 V · szyna „−” = GND</text>
<rect x="60" y="122" width="1680" height="46" rx="10" fill="#fff0cf"/>
<text x="82" y="152" class="body">Odłącz USB przed zmianą przewodów. Obie szyny pozostają oddzielne. Kolory porównaj z oznaczeniami modułów.</text>
